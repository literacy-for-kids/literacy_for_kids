<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Literacy for Kids Hub Logo</title>
  <desc id="desc">A compact open book icon with nine colorful dots orbiting it, representing the Literacy for Kids curriculum family.</desc>

  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background badge -->
  <rect x="12" y="12" width="176" height="176" rx="42" fill="#F8FAFC"/>
  <rect x="12" y="12" width="176" height="176" rx="42" stroke="#CBD5E1" stroke-width="6"/>

  <!-- Subtle orbit path -->
  <circle cx="100" cy="100" r="72" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 11"/>

  <!-- Nine curriculum dots -->
  <g filter="url(#softShadow)">
    <!-- Computer -->
    <circle cx="100" cy="28" r="10" fill="#4A90D9"/>
    <!-- Financial -->
    <circle cx="146" cy="45" r="10" fill="#CA8A04"/>
    <!-- Decision -->
    <circle cx="171" cy="88" r="10" fill="#EA580C"/>
    <!-- Media -->
    <circle cx="162" cy="137" r="10" fill="#DC2626"/>
    <!-- Civic -->
    <circle cx="125" cy="169" r="10" fill="#4338CA"/>
    <!-- Legal -->
    <circle cx="75" cy="169" r="10" fill="#B45309"/>
    <!-- Emotional & Social -->
    <circle cx="38" cy="137" r="10" fill="#7C3AED"/>
    <!-- Environmental Systems -->
    <circle cx="29" cy="88" r="10" fill="#166534"/>
    <!-- Health Systems -->
    <circle cx="54" cy="45" r="10" fill="#0E7490"/>
  </g>

  <!-- Central open book -->
  <g filter="url(#softShadow)">
    <!-- Left page -->
    <path d="M46 79
             C46 72 52 67 59 68
             C75 70 88 77 100 90
             V146
             C88 134 75 128 57 126
             C50 125 46 120 46 113
             V79Z"
          fill="#FFFFFF" stroke="#1E3A8A" stroke-width="7" stroke-linejoin="round"/>

    <!-- Right page -->
    <path d="M154 79
             C154 72 148 67 141 68
             C125 70 112 77 100 90
             V146
             C112 134 125 128 143 126
             C150 125 154 120 154 113
             V79Z"
          fill="#FFFFFF" stroke="#1E3A8A" stroke-width="7" stroke-linejoin="round"/>

    <!-- Page fold -->
    <path d="M100 90V146" stroke="#60A5FA" stroke-width="5" stroke-linecap="round"/>

    <!-- Left page lines/icons -->
    <path d="M61 88H82" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
    <path d="M61 103H88" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="68" cy="119" r="5" fill="#22C55E"/>

    <!-- Right page lines/icons -->
    <path d="M118 88H139" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
    <path d="M112 103H139" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="132" cy="119" r="5" fill="#F97316"/>
  </g>

  <!-- Learning spark / lightbulb simplified -->
  <g filter="url(#softShadow)">
    <circle cx="100" cy="66" r="19" fill="#FACC15" stroke="#FFFFFF" stroke-width="5"/>
    <path d="M91 64
             C91 57 96 53 100 53
             C104 53 109 57 109 64
             C109 68 106 71 104 74
             H96
             C94 71 91 68 91 64Z"
          fill="#FFFFFF" opacity="0.95"/>
    <path d="M95 81H105" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
