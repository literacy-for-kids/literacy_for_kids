<svg viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="grTitle">
  <title id="grTitle">Grounding 5-4-3-2-1: five things you can see, four you can hear, three you can touch, two you can smell, one slow breath</title>
  <rect x="1" y="1" width="638" height="458" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="320" y="48" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e293b">Grounding: 5&#8211;4&#8211;3&#8211;2&#8211;1</text>
  <text x="320" y="74" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#64748b">Look around and quietly notice&#8230;</text>

  <!-- Row 5: see -->
  <circle cx="110" cy="128" r="24" fill="#0ea5e9"/>
  <text x="110" y="137" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="700" fill="#ffffff">5</text>
  <text x="155" y="135" font-family="'Segoe UI', system-ui, sans-serif" font-size="19" fill="#1e293b">things you can <tspan font-weight="700">see</tspan></text>
  <g transform="translate(505 128)">
    <ellipse cx="0" cy="0" rx="30" ry="17" fill="none" stroke="#0ea5e9" stroke-width="3"/>
    <circle cx="0" cy="0" r="8" fill="#0ea5e9"/>
  </g>

  <!-- Row 4: hear -->
  <circle cx="110" cy="192" r="24" fill="#8b5cf6"/>
  <text x="110" y="201" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="700" fill="#ffffff">4</text>
  <text x="155" y="199" font-family="'Segoe UI', system-ui, sans-serif" font-size="19" fill="#1e293b">things you can <tspan font-weight="700">hear</tspan></text>
  <g transform="translate(490 192)" stroke="#8b5cf6" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M0,-12 A14,14 0 0 1 0,12"/>
    <path d="M9,-19 A24,24 0 0 1 9,19"/>
    <path d="M18,-26 A34,34 0 0 1 18,26"/>
    <circle cx="-10" cy="0" r="5" fill="#8b5cf6" stroke="none"/>
  </g>

  <!-- Row 3: touch -->
  <circle cx="110" cy="256" r="24" fill="#f59e0b"/>
  <text x="110" y="265" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="700" fill="#ffffff">3</text>
  <text x="155" y="263" font-family="'Segoe UI', system-ui, sans-serif" font-size="19" fill="#1e293b">things you can <tspan font-weight="700">touch</tspan></text>
  <g transform="translate(505 256)" stroke="#f59e0b" stroke-width="3" fill="none">
    <ellipse cx="0" cy="0" rx="9" ry="12"/>
    <ellipse cx="0" cy="0" rx="17" ry="20"/>
    <ellipse cx="0" cy="0" rx="25" ry="28" stroke-dasharray="6 5"/>
  </g>

  <!-- Row 2: smell -->
  <circle cx="110" cy="320" r="24" fill="#ec4899"/>
  <text x="110" y="329" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="700" fill="#ffffff">2</text>
  <text x="155" y="320" font-family="'Segoe UI', system-ui, sans-serif" font-size="19" fill="#1e293b">things you can <tspan font-weight="700">smell</tspan></text>
  <text x="155" y="340" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8">(or two smells you like)</text>
  <g transform="translate(505 320)" fill="#ec4899">
    <circle cx="0" cy="-11" r="7"/><circle cx="10" cy="-3" r="7"/><circle cx="6" cy="9" r="7"/><circle cx="-6" cy="9" r="7"/><circle cx="-10" cy="-3" r="7"/>
    <circle cx="0" cy="0" r="5" fill="#fbcfe8"/>
  </g>

  <!-- Row 1: breath -->
  <circle cx="110" cy="384" r="24" fill="#0e7490"/>
  <text x="110" y="393" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="700" fill="#ffffff">1</text>
  <text x="155" y="391" font-family="'Segoe UI', system-ui, sans-serif" font-size="19" fill="#1e293b"><tspan font-weight="700">slow breath</tspan></text>
  <g transform="translate(480 384)" stroke="#0e7490" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M0,0 C12,-14 28,-14 40,0"/>
    <path d="M0,10 C14,-2 34,-2 48,10"/>
  </g>
</svg>
