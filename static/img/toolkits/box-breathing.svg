<svg viewBox="0 0 640 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bbTitle">
  <title id="bbTitle">Box breathing: breathe in for 4, hold for 4, breathe out for 4, hold for 4, tracing a square</title>
  <defs>
    <marker id="bbArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="638" height="538" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="320" y="52" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e293b">Box Breathing</text>
  <text x="320" y="80" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" fill="#64748b">Trace the square with a finger or your eyes. Keep every count comfortable.</text>

  <!-- square -->
  <rect x="185" y="155" width="270" height="270" rx="12" fill="#f0fdfa" stroke="#0e7490" stroke-width="5"/>

  <!-- corner dots -->
  <circle cx="185" cy="155" r="9" fill="#0e7490"/>
  <circle cx="455" cy="155" r="9" fill="#0e7490"/>
  <circle cx="455" cy="425" r="9" fill="#0e7490"/>
  <circle cx="185" cy="425" r="9" fill="#0e7490"/>

  <!-- top: breathe in, left to right -->
  <line x1="205" y1="128" x2="435" y2="128" stroke="#0e7490" stroke-width="3.5" marker-end="url(#bbArrow)"/>
  <text x="320" y="118" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600" fill="#0e7490">Breathe in &#183; 1 2 3 4</text>

  <!-- right: hold, top to bottom -->
  <line x1="484" y1="175" x2="484" y2="405" stroke="#0e7490" stroke-width="3.5" marker-end="url(#bbArrow)"/>
  <text x="500" y="296" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600" fill="#0e7490" transform="rotate(90 500 296)" text-anchor="middle">Hold &#183; 1 2 3 4</text>

  <!-- bottom: breathe out, right to left -->
  <line x1="435" y1="452" x2="205" y2="452" stroke="#0e7490" stroke-width="3.5" marker-end="url(#bbArrow)"/>
  <text x="320" y="480" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600" fill="#0e7490">Breathe out &#183; 1 2 3 4</text>

  <!-- left: hold, bottom to top -->
  <line x1="156" y1="405" x2="156" y2="175" stroke="#0e7490" stroke-width="3.5" marker-end="url(#bbArrow)"/>
  <text x="140" y="296" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600" fill="#0e7490" transform="rotate(-90 140 296)" text-anchor="middle">Hold &#183; 1 2 3 4</text>

  <!-- count dots along each side -->
  <g fill="#5eead4">
    <circle cx="239" cy="155" r="5"/><circle cx="293" cy="155" r="5"/><circle cx="347" cy="155" r="5"/><circle cx="401" cy="155" r="5"/>
    <circle cx="455" cy="209" r="5"/><circle cx="455" cy="263" r="5"/><circle cx="455" cy="317" r="5"/><circle cx="455" cy="371" r="5"/>
    <circle cx="401" cy="425" r="5"/><circle cx="347" cy="425" r="5"/><circle cx="293" cy="425" r="5"/><circle cx="239" cy="425" r="5"/>
    <circle cx="185" cy="371" r="5"/><circle cx="185" cy="317" r="5"/><circle cx="185" cy="263" r="5"/><circle cx="185" cy="209" r="5"/>
  </g>

  <text x="320" y="284" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#64748b">in &#183; hold &#183; out &#183; hold</text>
  <text x="320" y="308" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#94a3b8">go around a few times</text>
</svg>
