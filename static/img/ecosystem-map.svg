<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="emTitle">
  <title id="emTitle">The Literacy for Kids ecosystem: nine domain literacies supported by seven shared toolkits</title>
  <defs>
    <marker id="emA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="858" height="518" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <text x="430" y="46" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e293b">Domain Literacies <tspan font-weight="400" font-size="15" fill="#64748b">&#8212; understand the systems around you</tspan></text>

  <!-- 9 curriculum chips, 3 x 3 -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <g><rect x="55" y="70" width="230" height="46" rx="23" fill="#4a90d9"/><text x="170" y="99" fill="#ffffff">Computer</text></g>
    <g><rect x="315" y="70" width="230" height="46" rx="23" fill="#ca8a04"/><text x="430" y="99" fill="#ffffff">Financial</text></g>
    <g><rect x="575" y="70" width="230" height="46" rx="23" fill="#ea580c"/><text x="690" y="99" fill="#ffffff">Decision</text></g>
    <g><rect x="55" y="128" width="230" height="46" rx="23" fill="#dc2626"/><text x="170" y="157" fill="#ffffff">Media</text></g>
    <g><rect x="315" y="128" width="230" height="46" rx="23" fill="#4338ca"/><text x="430" y="157" fill="#ffffff">Civic</text></g>
    <g><rect x="575" y="128" width="230" height="46" rx="23" fill="#b45309"/><text x="690" y="157" fill="#ffffff">Legal</text></g>
    <g><rect x="55" y="186" width="230" height="46" rx="23" fill="#7c3aed"/><text x="170" y="215" fill="#ffffff">Emotional &#38; Social</text></g>
    <g><rect x="315" y="186" width="230" height="46" rx="23" fill="#166534"/><text x="430" y="215" fill="#ffffff">Environmental Systems</text></g>
    <g><rect x="575" y="186" width="230" height="46" rx="23" fill="#0e7490"/><text x="690" y="215" fill="#ffffff">Health Systems</text></g>
  </g>

  <!-- connector -->
  <line x1="430" y1="252" x2="430" y2="296" stroke="#64748b" stroke-width="3" marker-start="url(#emA)" marker-end="url(#emA)"/>
  <text x="448" y="280" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#64748b">toolkits support every literacy</text>

  <text x="430" y="330" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#1e293b">Shared Toolkits <tspan font-weight="400" font-size="15" fill="#64748b">&#8212; skills you use in every literacy</tspan></text>

  <!-- 7 toolkit chips: 4 + 3 -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    <g><rect x="55" y="352" width="180" height="42" rx="21" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="145" y="379" fill="#334155">Coping Skills</text></g>
    <g><rect x="250" y="352" width="180" height="42" rx="21" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="340" y="379" fill="#334155">Communication</text></g>
    <g><rect x="445" y="352" width="180" height="42" rx="21" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="535" y="379" fill="#334155">Problem Solving</text></g>
    <g><rect x="640" y="352" width="180" height="42" rx="21" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="730" y="379" fill="#334155">Learning to Learn</text></g>
    <g><rect x="120" y="406" width="190" height="42" rx="21" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="215" y="433" fill="#334155">Executive Function</text></g>
    <g><rect x="325" y="406" width="180" height="42" rx="21" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="415" y="433" fill="#334155">Collaboration</text></g>
    <g><rect x="520" y="406" width="220" height="42" rx="21" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="630" y="433" fill="#334155">Information Organization</text></g>
  </g>

  <text x="430" y="490" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#94a3b8">One hub. Nine curricula. Seven toolkits. All free.</text>
</svg>
